[project]
name = "loginforce"
version = "0.2.0"
description = "Controlled HTTP login-form testing tool for authorized security assessments."
requires-python = ">=3.10"
dependencies = [
    "requests==2.32.3",
    "pyfiglet==1.0.2",
]

[project.scripts]
loginforce = "loginforce.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loginforce*"]
